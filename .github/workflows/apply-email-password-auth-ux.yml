name: Apply email password auth UX

on:
  push:
    branches:
      - fix/email-password-auth-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-password-auth-ux
          fetch-depth: 0
      - name: Patch auth source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Driver private-invite email/password flow.
          path = 'src/components/auth/DriverInviteAuthScreen.tsx'
          replace(path,
              "import{requireSupabase}from'../../lib/supabase';\nimport{AuthShell}from'./AuthShell';\n\nconst friendly=(error:unknown,fallback:string)=>{const message=error instanceof Error?error.message:String(error??'');if(/email not confirmed|email_not_confirmed/i.test(message))return'Tu correo aún no está confirmado. Revisa tu bandeja o solicita un nuevo enlace.';if(/invalid login credentials/i.test(message))return'Correo o contraseña incorrectos.';if(/user already registered|already been registered/i.test(message))return'Este correo ya está registrado. Usa “Ya tengo cuenta”.';if(/email rate limit exceeded|over_email_send_rate_limit|rate limit|too many requests/i.test(message))return'Se alcanzó temporalmente el límite de correos. Espera unos minutos antes de volver a intentarlo.';return message||fallback;};",
              "import{requireSupabase}from'../../lib/supabase';\nimport{friendlyAuthError,validateAuthPassword}from'../../lib/authPasswordPolicy';\nimport{AuthShell}from'./AuthShell';\nimport{PasswordRequirements}from'./PasswordRequirements';")
          replace(path, "friendly(err,'No fue posible validar la invitación.')", "friendlyAuthError(err,'No fue posible validar la invitación.')")
          replace(path, "friendly(err,'No fue posible continuar con Google.')", "friendlyAuthError(err,'No fue posible continuar con Google.')")
          replace(path, "friendly(err,'No fue posible reenviar el correo de confirmación.')", "friendlyAuthError(err,'No fue posible reenviar el correo de confirmación.')")
          replace(path,
              "if(password.length<10)throw new Error('La contraseña debe tener al menos 10 caracteres.');",
              "const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);")
          replace(path, "friendly(err,mode==='register'?'No fue posible crear tu cuenta.':'No fue posible iniciar sesión.')", "friendlyAuthError(err,mode==='register'?'No fue posible crear tu cuenta.':'No fue posible iniciar sesión.')")
          replace(path,
              "placeholder=\"Mínimo 10 caracteres\"/></label>{mode==='register'&&<label",
              "placeholder={mode==='register'?'10+ caracteres, mayúscula, número y símbolo':'Tu contraseña'}/></label>{mode==='register'&&<PasswordRequirements password={password}/>} {mode==='register'&&<label")
          replace(path,
              "<p className=\"cg-auth-hint\">Alta directa autorizada por la central · sin proceso documental de postulación</p>",
              "<p className=\"cg-auth-hint\">Tu cuenta de correo queda guardada en Central GO. Google es opcional · alta directa autorizada por la central</p>")

          # Generic login/signup screen.
          path = 'src/components/auth/LoginScreenBase.tsx'
          start = "const friendlyAuthError = (error: unknown, fallback: string) => {\n  const message = error instanceof Error ? error.message : String(error ?? '');\n  if (/email rate limit exceeded|over_email_send_rate_limit|too many requests|rate limit/i.test(message)) return 'Se alcanzó temporalmente el límite de correos. Espera unos minutos antes de volver a intentarlo.';\n  if (/email link is invalid|expired|otp_expired|one-time token not found/i.test(message)) return 'Este enlace ya fue utilizado o dejó de ser válido. Solicita uno nuevo.';\n  if (/invalid login credentials/i.test(message)) return 'Correo o contraseña incorrectos.';\n  if (/user already registered|already been registered/i.test(message)) return 'Este correo ya está registrado. Inicia sesión o recupera tu contraseña.';\n  return message || fallback;\n};\n"
          replace(path, "import { AuthShell } from './AuthShell';\n", "import { AuthShell } from './AuthShell';\nimport { PasswordRequirements } from './PasswordRequirements';\nimport { friendlyAuthError } from '../../lib/authPasswordPolicy';\n")
          replace(path, start, '')
          replace(path,
              "placeholder={mode === 'register' ? 'Mínimo 10 caracteres' : 'Tu contraseña'} />\n        </label>\n        {mode === 'register' && (",
              "placeholder={mode === 'register' ? '10+ caracteres, mayúscula, número y símbolo' : 'Tu contraseña'} />\n        </label>\n        {mode === 'register' && <PasswordRequirements password={password} />}\n        {mode === 'register' && (")
          replace(path,
              "{mode === 'register' ? 'Registro seguro · confirmación por correo · sin cobro al crear la cuenta' : 'Acceso cifrado y protegido por permisos según tu rol'}",
              "{mode === 'register' ? 'Tu usuario queda guardado en Central GO · confirmación por correo · Google es opcional' : 'Acceso cifrado con tu correo y contraseña · Google es opcional'}")

          # Central auth context: validate the same policy client-side before Supabase.
          path = 'src/context/AuthContext.tsx'
          replace(path, "import { googleOAuthOptions } from '../lib/googleOAuth';\n", "import { googleOAuthOptions } from '../lib/googleOAuth';\nimport { validateAuthPassword } from '../lib/authPasswordPolicy';\n")
          replace(path,
              "if(password.length<10)throw new Error('La contraseña debe tener al menos 10 caracteres.');rememberIntent(intent);",
              "const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);rememberIntent(intent);")
          replace(path,
              "const updatePassword=async(password:string)=>{if(password.length<10)throw new Error('La contraseña debe tener al menos 10 caracteres.');const db=requireSupabase();",
              "const updatePassword=async(password:string)=>{const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);const db=requireSupabase();")
          PY
      - name: Commit patched auth files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auth/DriverInviteAuthScreen.tsx src/components/auth/LoginScreenBase.tsx src/context/AuthContext.tsx
          git commit -m "fix email password account creation UX"
          git push origin HEAD:fix/email-password-auth-ux
