name: Apply driver portal hotfix

on:
  push:
    branches:
      - hotfix/driver-insertbefore-portal
    paths:
      - 'scripts/_hotfix_driver_portal.py'
      - '.github/workflows/apply-hotfix-driver-portal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/driver-insertbefore-portal
      - name: Aplicar hotfix
        run: python3 scripts/_hotfix_driver_portal.py
      - name: Verificar TypeScript
        run: |
          npm ci --no-audit --no-fund
          npm run lint
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/pwa/DriverMobileView.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Montar fila del conductor sin portal DOM"
          git push origin HEAD:hotfix/driver-insertbefore-portal
