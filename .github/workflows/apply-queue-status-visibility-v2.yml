name: Apply queue status visibility v2

on:
  push:
    branches:
      - fix/queue-paused-offline-visible

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/queue-paused-offline-visible
      - name: Apply patch
        run: python3 scripts/_patch_queue_status_visibility.py
      - name: Validate
        run: |
          git diff --check
          grep -q "Pausa mantiene lugar · desconectados al final" src/components/modules/OperatorConsole.tsx
          grep -q "DESCONECTADO" src/components/modules/OperatorConsole.tsx
          grep -q "queueItem?.status === 'paused'" src/components/modules/OperatorConsole.tsx
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modules/OperatorConsole.tsx
          git commit -m "fix keep paused and disconnected drivers visible in queue"
          git push origin HEAD:fix/queue-paused-offline-visible
