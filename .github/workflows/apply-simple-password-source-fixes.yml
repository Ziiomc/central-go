name: Apply simple password source fixes

on:
  push:
    branches:
      - fix/simple-password-no-email

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-password-no-email
      - name: Patch remaining password flows
        shell: python
        run: |
          from pathlib import Path

          auth = Path('src/context/AuthContext.tsx')
          text = auth.read_text()
          text = text.replace(
              "import { validateAuthPassword } from '../lib/authPasswordPolicy';",
              "import { validateAuthPassword } from '../lib/authPasswordPolicy';\nimport { createPasswordAccountWithoutEmail, signInWithCompatiblePassword, updateWithCompatiblePassword } from '../lib/passwordAuth';"
          )
          old_signup = "const signUp=async(email:string,password:string,intent:OnboardingRole)=>{const normalized=email.trim().toLowerCase();if(!normalized.includes('@'))throw new Error('Ingresa un correo válido.');const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);rememberIntent(intent);const db=requireSupabase();const {data,error}=await db.auth.signUp({email:normalized,password,options:{emailRedirectTo:`${runtimeConfig.officialAppUrl}/`,data:{account_kind:intent}}});if(error)throw error;if(data.session){await loadIdentity(data.session);return true;}return false;};"
          new_signup = "const signUp=async(email:string,password:string,intent:OnboardingRole)=>{const normalized=email.trim().toLowerCase();if(!normalized.includes('@'))throw new Error('Ingresa un correo válido.');const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);if(intent==='operator')throw new Error('El administrador de la central crea las cuentas de operadores.');rememberIntent(intent);await createPasswordAccountWithoutEmail(normalized,password,intent);const {data}=await signInWithCompatiblePassword(normalized,password);if(!data.session)throw new Error('No fue posible iniciar la sesión.');await loadIdentity(data.session);return true;};"
          old_signin = "const signIn=async(email:string,password:string)=>{const db=requireSupabase();const {data,error}=await db.auth.signInWithPassword({email:email.trim(),password});if(error)throw error;if(data.session)await loadIdentity(data.session);};"
          new_signin = "const signIn=async(email:string,password:string)=>{const {data}=await signInWithCompatiblePassword(email,password);if(data.session)await loadIdentity(data.session);};"
          old_update = "const updatePassword=async(password:string)=>{const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);const db=requireSupabase();const metadata={...(sessionRef.current?.user.user_metadata??{}),needs_password_setup:false,operator_invite:false};const {error}=await db.auth.updateUser({password,data:metadata});if(error)throw error;};"
          new_update = "const updatePassword=async(password:string)=>{const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);const email=sessionRef.current?.user.email;if(!email)throw new Error('No fue posible identificar el correo de la cuenta.');const result=await updateWithCompatiblePassword(email,password);if(result.error)throw result.error;const db=requireSupabase();const metadata={...(sessionRef.current?.user.user_metadata??{}),needs_password_setup:false,operator_invite:false,centralgo_password_v1:true};const {error}=await db.auth.updateUser({data:metadata});if(error)throw error;};"
          old_reset = "const requestPasswordReset=async(email:string)=>{const normalized=email.trim().toLowerCase();if(!normalized.includes('@'))throw new Error('Ingresa un correo válido.');const db=requireSupabase();const {error}=await db.auth.resetPasswordForEmail(normalized,{redirectTo:`${runtimeConfig.officialAppUrl}/`});if(error)throw error;};"
          new_reset = "const requestPasswordReset=async(_email:string)=>{throw new Error('La recuperación por enlace de correo está desactivada. Solicita al administrador o a soporte que restablezca tu acceso.');};"
          for old, new in [(old_signup,new_signup),(old_signin,new_signin),(old_update,new_update),(old_reset,new_reset)]:
              if old not in text:
                  raise SystemExit(f'AuthContext target not found: {old[:80]}')
              text = text.replace(old,new)
          auth.write_text(text)

          operators = Path('src/components/modules/OperatorsModule.tsx')
          text = operators.read_text()
          text = text.replace("if (password.length < 10) throw new Error('La contraseña debe tener al menos 10 caracteres.');", "if (password.length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres.');")
          text = text.replace('minLength={10}', 'minLength={8}')
          text = text.replace('placeholder="Mínimo 10 caracteres"', 'placeholder="Mínimo 8 caracteres"')
          text = text.replace('grid grid-cols-2 gap-2 rounded-xl', 'grid grid-cols-1 gap-2 rounded-xl')
          google_button = "<button type=\"button\" onClick={()=>setCreateMode('google')} className={`rounded-lg px-3 py-2 text-[10px] font-black ${createMode==='google'?'bg-blue-600 text-white':'text-zinc-500'}`}>Correo personal</button>"
          if google_button not in text:
              raise SystemExit('Operator email invite button target not found')
          text = text.replace(google_button, '')
          operators.write_text(text)

          config = Path('supabase/config.toml')
          text = config.read_text()
          text = text.replace('min_length = 10', 'min_length = 8')
          text = text.replace('password_requirements = "lower_upper_letters_digits_symbols"', 'password_requirements = ""')
          config.write_text(text)
      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/AuthContext.tsx src/components/modules/OperatorsModule.tsx supabase/config.toml
          git diff --cached --check
          git commit -m "fix finish simple password and disable email recovery flows"
          git push origin HEAD:fix/simple-password-no-email
