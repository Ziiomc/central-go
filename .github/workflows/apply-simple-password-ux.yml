name: Apply simple password UX

on:
  push:
    branches:
      - fix/simpler-password-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simpler-password-policy
          fetch-depth: 0
      - name: Simplify password forms
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path('src/components/auth').glob('*.tsx')) + [Path('src/App.tsx')]
          replacements = [
              ('minLength={10}', 'minLength={8}'),
              ('Mínimo 10 caracteres', 'Mínimo 8 caracteres'),
              ('10+ caracteres, mayúscula, número y símbolo', 'Mínimo 8 caracteres'),
              ('password.length<10', 'password.length<8'),
              ('Usa al menos 10 caracteres.', 'Usa al menos 8 caracteres.'),
              ('La contraseña debe tener al menos 10 caracteres.', 'La contraseña debe tener al menos 8 caracteres.'),
          ]

          changed = []
          for path in files:
              text = path.read_text()
              original = text
              for old, new in replacements:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No password form text was changed')
          print('Updated:', ', '.join(changed))
          PY
      - name: Verify old requirements are gone from auth UI
        run: |
          if grep -R -n -E 'minLength=\{10\}|Mínimo 10 caracteres|10\+ caracteres, mayúscula, número y símbolo|password\.length<10|Usa al menos 10 caracteres|contraseña debe tener al menos 10 caracteres' src/components/auth src/App.tsx; then
            echo 'Old password requirements remain in the UI'
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auth src/App.tsx
          git commit -m "simplify all password fields to eight characters"
          git push origin HEAD:fix/simpler-password-policy
