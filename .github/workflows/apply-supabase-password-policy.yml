name: Apply Supabase simple password policy

on:
  push:
    branches:
      - fix/simpler-password-policy

permissions:
  contents: read

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: cuazdzsvgwrnpczbvrgx
      TOKEN_PRIMARY: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      TOKEN_FALLBACK: ${{ secrets.SUPABASE_TOKEN }}
      TOKEN_PAT: ${{ secrets.SUPABASE_PAT }}
    steps:
      - name: Resolve management token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${TOKEN_PRIMARY:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_FALLBACK:-}"; fi
          if [ -z "$TOKEN" ]; then TOKEN="${TOKEN_PAT:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "No Supabase Management API token is configured in repository secrets."
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/supabase_token"

      - name: Read current password policy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/supabase_token")"
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq '{password_min_length,password_required_characters}'

      - name: Apply 8-character password policy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/supabase_token")"
          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"password_min_length":8,"password_required_characters":""}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            | jq '{password_min_length,password_required_characters}'

      - name: Verify applied policy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat "$RUNNER_TEMP/supabase_token")"
          RESULT="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth")"
          MIN="$(printf '%s' "$RESULT" | jq -r '.password_min_length')"
          REQUIRED="$(printf '%s' "$RESULT" | jq -r '.password_required_characters // ""')"
          test "$MIN" = "8"
          test -z "$REQUIRED"
          echo "Supabase password policy synchronized: minimum 8 characters, no required character classes."
