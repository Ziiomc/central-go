name: Apply tariff map colleagues

on:
  push:
    branches:
      - feature/tariff-map-driver-colleagues

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tariff-map-driver-colleagues
      - name: Apply patch
        run: python3 scripts/_apply_tariff_map_colleagues.py
      - name: Validate patch
        run: |
          git diff --check
          grep -q "id: 'tariff'" src/components/Sidebar.tsx
          grep -q "case'tariff'" src/App.tsx
          grep -q "form-message" src/components/map/LiveMap.tsx
          grep -q "Móviles conectados" src/components/pwa/DriverPriorityCounter.tsx
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/Sidebar.tsx src/App.tsx src/components/modules/SettingsModule.tsx src/components/map/LiveMap.tsx src/components/pwa/DriverPriorityCounter.tsx
          git commit -m "feat improve tariff map actions and driver queue visibility"
          git push origin HEAD:feature/tariff-map-driver-colleagues
