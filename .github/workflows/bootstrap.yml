name: Preparar Central GO

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  preparar-proyecto:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'bootstrap-central-go'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir y verificar el código
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/central-go.tar.xz
          echo "cb119f0c18190bde8ef8aa02400d72e8c3c24bdad34f7f227d8fd7df63fd0c19  /tmp/central-go.tar.xz" | sha256sum --check
          tar -xJf /tmp/central-go.tar.xz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Publicar código en la rama principal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar versión mejorada de Central GO"
          git push origin HEAD:main

      - name: Cerrar incidencia técnica
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            })
