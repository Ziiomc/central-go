name: Calidad Central GO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Reglas comerciales
        run: npm run check:commercial

      - name: Compilar producción
        run: npm run build
