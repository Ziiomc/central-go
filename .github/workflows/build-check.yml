name: Verificar compilación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Central GO
        run: npm run build
      - name: Diagnosticar selección del mapa
        if: always()
        run: |
          echo '--- LIVE MAP API ---'
          grep -nE 'interface.*LiveMap|type.*LiveMap|onSelectDriver|focusDriverId|L\.map|mapInstanceRef\.current' src/components/map/LiveMap.tsx | head -n 120 || true
          echo '--- LIVE MAP 1-210 ---'
          nl -ba src/components/map/LiveMap.tsx | sed -n '1,210p' || true
          echo '--- LIVE MAP 210-330 ---'
          nl -ba src/components/map/LiveMap.tsx | sed -n '210,330p' || true
