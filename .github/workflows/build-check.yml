name: Verificar compilación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Central GO
        run: npm run build
      - name: Diagnosticar selección del mapa
        if: always()
        run: |
          echo '--- OPERATOR CONSOLE 90-250 ---'
          nl -ba src/components/modules/OperatorConsole.tsx | sed -n '90,250p' || true
          echo '--- OPERATOR CONSOLE 300-500 ---'
          nl -ba src/components/modules/OperatorConsole.tsx | sed -n '300,500p' || true
          echo '--- LIVE MAP 300-560 ---'
          nl -ba src/components/map/LiveMap.tsx | sed -n '300,560p' || true
