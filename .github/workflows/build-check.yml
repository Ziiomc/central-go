name: Verificar compilación

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Compilar Central GO
        run: npm run build
      - name: Diagnosticar selección del mapa
        if: always()
        run: |
          echo '--- ARCHIVOS DEL MAPA ---'
          find src -type f \( -iname '*map*' -o -iname '*fleet*' -o -iname '*vehicle*' \) -print 2>/dev/null || true
          echo '--- REFERENCIAS A SELECCIÓN ---'
          grep -RniE 'selectedVehicle|selectedMobile|selectedDriver|setSelected|onVehicle|vehicle.*select|mobile.*select' src 2>/dev/null | head -n 160 || true
