name: Calidad Central GO

on:
  push:
    branches: [main, commercial]
  pull_request:
    branches: [main, commercial]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: centralgo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d centralgo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: centralgo_test
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit --no-fund

      - name: TypeScript
        run: npm run lint

      - name: Reglas comerciales estáticas
        run: npm run check:commercial

      - name: Preparar compatibilidad Supabase en PostgreSQL de prueba
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create role service_role nologin;
          create schema auth;
          create table auth.users (
            id uuid primary key,
            email text,
            email_confirmed_at timestamptz,
            raw_user_meta_data jsonb not null default '{}'::jsonb
          );
          create or replace function auth.uid()
          returns uuid
          language sql
          stable
          as $$
            select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid;
          $$;
          grant usage on schema auth to anon, authenticated;
          grant execute on function auth.uid() to anon, authenticated;
          create publication supabase_realtime;
          SQL
          psql -v ON_ERROR_STOP=1 -f supabase/tests/storage-compat.sql

      - name: Ejecutar migraciones comerciales desde cero
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            echo "Aplicando $migration"
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done

      - name: Probar pausa, desconexión y posición del conductor
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/driver-queue-lifecycle.sql

      - name: Probar operaciones críticas de carreras
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/critical-trip-operations.sql

      - name: Someter la consola de operadora a estrés transaccional
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operator-stress.sql

      - name: Probar aislamiento RLS y anti-escalación
        shell: bash
        run: |
          set -euo pipefail
          OPERATOR_ID='11111111-1111-4111-8111-111111111111'
          COMPANY_A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'
          COMPANY_B='bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb'

          psql -v ON_ERROR_STOP=1 <<SQL
          insert into auth.users (id, email, email_confirmed_at, raw_user_meta_data)
          values ('$OPERATOR_ID', 'operator@centralgo.test', now(), '{"name":"Operadora QA"}');

          insert into public.companies (id, name, code, active)
          values
            ('$COMPANY_A', 'Central QA A', 'QAA', true),
            ('$COMPANY_B', 'Central QA B', 'QAB', true);

          insert into public.company_memberships (company_id, user_id, role, active)
          values ('$COMPANY_A', '$OPERATOR_ID', 'operator', true);

          insert into public.clients (company_id, name, phone)
          values
            ('$COMPANY_A', 'Cliente visible', '+56000000001'),
            ('$COMPANY_B', 'Cliente aislado', '+56000000002');
          SQL

          VISIBLE_COMPANIES=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$OPERATOR_ID';
          select count(*) from public.companies;
          SQL
          )
          test "$VISIBLE_COMPANIES" = "1" || { echo "RLS FAIL: empresas visibles=$VISIBLE_COMPANIES"; exit 1; }

          VISIBLE_CLIENTS=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$OPERATOR_ID';
          select count(*) from public.clients;
          SQL
          )
          test "$VISIBLE_CLIENTS" = "1" || { echo "RLS FAIL: clientes visibles=$VISIBLE_CLIENTS"; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$OPERATOR_ID';
          update public.profiles set name = 'Operadora QA Actualizada' where id = '$OPERATOR_ID';
          select public.centralgo_write_audit('$COMPANY_A', 'CI_TEST', 'Prueba de auditoría autenticada');
          SQL

          if psql -q -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$OPERATOR_ID';
          update public.profiles set global_role = 'super_admin' where id = '$OPERATOR_ID';
          SQL
          then
            echo 'SECURITY FAIL: un usuario pudo autoasignarse super_admin.'
            exit 1
          else
            echo 'Anti-escalación de privilegios: OK'
          fi

          AUDIT_COUNT=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.audit_logs where action = 'CI_TEST';")
          test "$AUDIT_COUNT" = "1" || { echo "AUDIT FAIL: registros=$AUDIT_COUNT"; exit 1; }

      - name: Probar aprovisionamiento, partners y flujo del conductor
        shell: bash
        run: |
          set -euo pipefail
          OPERATOR_ID='11111111-1111-4111-8111-111111111111'
          SUPER_ID='22222222-2222-4222-8222-222222222222'
          DRIVER_ID='33333333-3333-4333-8333-333333333333'
          DRIVER_ROW='44444444-4444-4444-8444-444444444444'
          TRIP_ID='55555555-5555-4555-8555-555555555555'
          SALES_ID='66666666-6666-4666-8666-666666666666'
          SALES_PARTNER='77777777-7777-4777-8777-777777777777'
          COMPANY_A='aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'

          psql -v ON_ERROR_STOP=1 <<SQL
          insert into auth.users (id,email,email_confirmed_at,raw_user_meta_data) values
            ('$SUPER_ID','owner@centralgo.test',now(),'{"name":"Owner QA"}'),
            ('$DRIVER_ID','driver@centralgo.test',now(),'{"name":"Driver QA"}'),
            ('$SALES_ID','partner@centralgo.test',now(),'{"name":"Partner QA"}');
          update public.profiles set global_role='super_admin' where id='$SUPER_ID';
          update public.profiles set global_role='sales_partner' where id='$SALES_ID';
          insert into public.partners(id,user_id,kind,code,commission_percent,active)
            values('$SALES_PARTNER','$SALES_ID','sales','PARTNER-QA',20,true);
          insert into public.company_memberships(company_id,user_id,role,active)
            values('$COMPANY_A','$DRIVER_ID','driver',true);
          insert into public.drivers(id,company_id,user_id,unit_number,display_name,license_number,status)
            values('$DRIVER_ROW','$COMPANY_A','$DRIVER_ID','Móvil QA','Driver QA','LIC-QA','en_route');
          insert into public.trips(
            id,company_id,code,client_name,client_phone,origin_address,origin_lat,origin_lng,
            destination_address,destination_lat,destination_lng,status,driver_id,driver_unit_number,driver_name,operator_name
          ) values(
            '$TRIP_ID','$COMPANY_A','QA-TRIP','Cliente QA','+56000000003','Origen QA',-35.84,-71.59,
            'Destino QA',-35.85,-71.60,'assigned','$DRIVER_ROW','Móvil QA','Driver QA','Operadora QA'
          );
          SQL

          if psql -q -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$OPERATOR_ID';
          select public.centralgo_superadmin_create_company('Hack Central','HACK','Linares');
          SQL
          then
            echo 'SECURITY FAIL: una operadora pudo registrar una central global.'
            exit 1
          else
            echo 'Aprovisionamiento protegido para Superadmin: OK'
          fi

          NEW_COMPANY=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$SUPER_ID';
          select public.centralgo_superadmin_create_company('Central Piloto QA','PILOTO-QA','Linares','CL',null,null,'enterprise','annual',14,-35.845,-71.598);
          SQL
          )
          test -n "$NEW_COMPANY" || { echo 'PROVISIONING FAIL: no se creó central'; exit 1; }
          SUB_COUNT=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.subscriptions where company_id='$NEW_COMPANY' and status='trialing';")
          test "$SUB_COUNT" = "1" || { echo "PROVISIONING FAIL: suscripciones=$SUB_COUNT"; exit 1; }

          PARTNER_COMPANY_JSON=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$SALES_ID';
          select public.centralgo_partner_create_company('Central Partner QA','PARTNER-CENTRAL','Talca','CL',null,null,'pro','annual',null,14);
          SQL
          )
          PARTNER_COMPANY=$(printf '%s' "$PARTNER_COMPANY_JSON" | sed -n 's/.*"companyId"[ ]*:[ ]*"\([^"]*\)".*/\1/p')
          test -n "$PARTNER_COMPANY" || { echo "PARTNER PROVISION FAIL: $PARTNER_COMPANY_JSON"; exit 1; }
          REF_COUNT=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.referrals where company_id='$PARTNER_COMPANY' and partner_id='$SALES_PARTNER' and active;")
          test "$REF_COUNT" = "1" || { echo "PARTNER ATTRIBUTION FAIL: referrals=$REF_COUNT"; exit 1; }

          SUPER_VISIBLE=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$SUPER_ID';
          select jsonb_array_length(public.centralgo_visible_network_centrals());
          SQL
          )
          test "$SUPER_VISIBLE" -ge 2 || { echo "NETWORK DIRECTORY FAIL: $SUPER_VISIBLE"; exit 1; }

          PARTNER_VISIBLE=$(psql -qAt -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$SALES_ID';
          select jsonb_array_length(public.centralgo_visible_network_centrals());
          SQL
          )
          test "$PARTNER_VISIBLE" = "1" || { echo "PARTNER SCOPE FAIL: $PARTNER_VISIBLE"; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub = '$DRIVER_ID';
          select (public.centralgo_driver_reject_trip('$TRIP_ID','No puedo tomar el servicio')).status;
          SQL
          TRIP_STATUS=$(psql -qAt -v ON_ERROR_STOP=1 -c "select status from public.trips where id='$TRIP_ID';")
          DRIVER_STATUS=$(psql -qAt -v ON_ERROR_STOP=1 -c "select status from public.drivers where id='$DRIVER_ROW';")
          test "$TRIP_STATUS" = "pending" || { echo "DRIVER REJECT FAIL: trip=$TRIP_STATUS"; exit 1; }
          test "$DRIVER_STATUS" = "available" || { echo "DRIVER REJECT FAIL: driver=$DRIVER_STATUS"; exit 1; }

      - name: Probar onboarding unificado y aprobación segura
        shell: bash
        run: |
          set -euo pipefail
          CENTRAL_OWNER='a1000000-0000-4000-8000-000000000001'
          DRIVER_APPLICANT='a1000000-0000-4000-8000-000000000002'
          NEW_PARTNER='a1000000-0000-4000-8000-000000000003'
          PRIMARY_SUPER='a1000000-0000-4000-8000-000000000004'

          psql -v ON_ERROR_STOP=1 <<SQL
          insert into auth.users(id,email,email_confirmed_at,raw_user_meta_data) values
            ('$CENTRAL_OWNER','self-central@centralgo.test',now(),'{"name":"Dueña Central"}'),
            ('$DRIVER_APPLICANT','self-driver@centralgo.test',now(),'{"name":"Conductor Solicitante"}'),
            ('$NEW_PARTNER','self-partner@centralgo.test',now(),'{"name":"Socio Comercial"}'),
            ('$PRIMARY_SUPER','ziiomc3@gmail.com',now(),'{"name":"Superadmin Principal"}');
          update public.profiles set global_role='super_admin' where id='$PRIMARY_SUPER';
          SQL

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$CENTRAL_OWNER';
          select public.centralgo_complete_onboarding('central','Dueña Central','+56911111111','Linares','CL','Central Autoregistro QA',null,null);
          SQL

          SELF_COMPANY=$(psql -qAt -v ON_ERROR_STOP=1 -c "select company_id from public.company_memberships where user_id='$CENTRAL_OWNER' and role='company_admin' and active;")
          test -n "$SELF_COMPANY" || { echo 'ONBOARDING FAIL: central sin membresía administrativa'; exit 1; }
          SELF_CODE=$(psql -qAt -v ON_ERROR_STOP=1 -c "select code from public.companies where id='$SELF_COMPANY';")
          FULL_TRIAL=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.subscriptions s join public.subscription_plans p on p.id=s.plan_id where s.company_id='$SELF_COMPANY' and s.status='trialing' and p.code='enterprise' and s.trial_ends_at>now()+interval '4 days' and s.trial_ends_at<=now()+interval '5 days 1 minute';")
          test "$FULL_TRIAL" = "1" || { echo 'ONBOARDING FAIL: la central no recibió 5 días Full'; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$NEW_PARTNER';
          select public.centralgo_complete_onboarding_v2('sales_partner','Socio Comercial','+56922222222','Talca','CL',null,null,null,'Maule',true);
          SQL
          PARTNER_PENDING=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.partner_applications where user_id='$NEW_PARTNER' and status='pending' and eligible_review_at>=created_at+interval '3 hours';")
          PARTNER_CREATED=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.partners where user_id='$NEW_PARTNER';")
          test "$PARTNER_PENDING" = "1" || { echo 'ONBOARDING FAIL: postulación comercial pendiente ausente'; exit 1; }
          test "$PARTNER_CREATED" = "0" || { echo 'SECURITY FAIL: socio activado antes de revisión'; exit 1; }

          PARTNER_APPLICATION=$(psql -qAt -v ON_ERROR_STOP=1 -c "select id from public.partner_applications where user_id='$NEW_PARTNER';")
          if psql -q -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='22222222-2222-4222-8222-222222222222';
          select public.centralgo_superadmin_review_partner_application('$PARTNER_APPLICATION',true,null);
          SQL
          then
            echo 'SECURITY FAIL: un Superadmin secundario revisó socios comerciales.'
            exit 1
          else
            echo 'Revisión comercial reservada al Superadmin principal: OK'
          fi

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$PRIMARY_SUPER';
          select public.centralgo_superadmin_review_partner_application('$PARTNER_APPLICATION',true,null);
          SQL
          EARLY_APPROVAL=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.partner_applications where id='$PARTNER_APPLICATION' and status='approved' and reviewed_at<eligible_review_at;")
          test "$EARLY_APPROVAL" = "1" || { echo 'ONBOARDING FAIL: el Superadmin principal no pudo aprobar anticipadamente'; exit 1; }
          PARTNER_RATE=$(psql -qAt -v ON_ERROR_STOP=1 -c "select commission_percent from public.partners where user_id='$NEW_PARTNER' and active;")
          test "$PARTNER_RATE" = "20.000" || { echo "ONBOARDING FAIL: comisión=$PARTNER_RATE"; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$DRIVER_APPLICANT';
          select public.centralgo_complete_onboarding_v2('driver','Conductor Solicitante','+56933333333','Linares','CL',null,null,null,'Maule',false);
          SQL
          DRIVER_PORTAL=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.saas_accounts where user_id='$DRIVER_APPLICANT' and account_kind='driver' and status='active' and company_id is null;")
          test "$DRIVER_PORTAL" = "1" || { echo 'ONBOARDING FAIL: portal inmediato del conductor ausente'; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$DRIVER_APPLICANT';
          select public.centralgo_prepare_driver_application('$SELF_COMPANY','Conductor Solicitante','+56933333333','11.111.111-1','LIC-SELF-QA','CL','Disponible jornada completa');
          SQL
          APPLICATION=$(psql -qAt -v ON_ERROR_STOP=1 -c "select id from public.driver_applications where user_id='$DRIVER_APPLICANT' and company_id='$SELF_COMPANY' and status='draft';")
          test -n "$APPLICATION" || { echo 'ONBOARDING FAIL: borrador de conductor ausente'; exit 1; }

          psql -v ON_ERROR_STOP=1 <<SQL
          insert into public.driver_application_documents(
            application_id,user_id,document_type,storage_path,original_name,mime_type,size_bytes,country_code
          ) values
            ('$APPLICATION','$DRIVER_APPLICANT','identity_document','$DRIVER_APPLICANT/$APPLICATION/identity.jpg','identity.jpg','image/jpeg',1024,'CL'),
            ('$APPLICATION','$DRIVER_APPLICANT','driver_license','$DRIVER_APPLICANT/$APPLICATION/license.jpg','license.jpg','image/jpeg',1024,'CL');
          SQL
          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$DRIVER_APPLICANT';
          select public.centralgo_submit_driver_application('$APPLICATION');
          SQL
          APPLICATION_STATUS=$(psql -qAt -v ON_ERROR_STOP=1 -c "select status from public.driver_applications where id='$APPLICATION';")
          test "$APPLICATION_STATUS" = "pending" || { echo "ONBOARDING FAIL: solicitud=$APPLICATION_STATUS"; exit 1; }

          if psql -q -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$DRIVER_APPLICANT';
          select public.centralgo_review_driver_application('$APPLICATION',true,'Móvil SELF',null,null);
          SQL
          then
            echo 'SECURITY FAIL: un conductor aprobó su propia solicitud.'
            exit 1
          else
            echo 'Autoaprobación de conductor bloqueada: OK'
          fi

          psql -v ON_ERROR_STOP=1 <<SQL
          set role authenticated;
          set request.jwt.claim.sub='$CENTRAL_OWNER';
          select public.centralgo_review_driver_application('$APPLICATION',true,'Móvil SELF',null,null);
          SQL
          DRIVER_ACCESS=$(psql -qAt -v ON_ERROR_STOP=1 -c "select count(*) from public.company_memberships m join public.drivers d on d.company_id=m.company_id and d.user_id=m.user_id where m.company_id='$SELF_COMPANY' and m.user_id='$DRIVER_APPLICANT' and m.role='driver' and m.active;")
          test "$DRIVER_ACCESS" = "1" || { echo 'ONBOARDING FAIL: aprobación no creó acceso profesional'; exit 1; }

      - name: Compilar producción
        run: npm run build
