name: Apply supermarket status button

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/centralgo-supermarket-button.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Patch operator queue
        run: node scripts/apply-supermarket-status.mjs
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit application change
        run: |
          rm -f .github/workflows/centralgo-supermarket-button.yml scripts/apply-supermarket-status.mjs
          git config user.name "central-go-automation"
          git config user.email "central-go-automation@users.noreply.github.com"
          git add -A
          git commit -m "Add shared supermarket status to driver queue"
          git push
