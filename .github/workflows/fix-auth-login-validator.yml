name: Fix auth login validator

on:
  push:
    branches:
      - fix/email-password-auth-ux

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/email-password-auth-ux
      - name: Patch login validator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/auth/DriverInviteAuthScreen.tsx')
          text=p.read_text()
          old="if(!normalized.includes('@'))throw new Error('Ingresa un correo válido.');const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);rememberDriverInviteToken(inviteCode);"
          new="if(!normalized.includes('@'))throw new Error('Ingresa un correo válido.');if(mode==='register'){const passwordError=validateAuthPassword(password);if(passwordError)throw new Error(passwordError);}rememberDriverInviteToken(inviteCode);"
          if old not in text: raise SystemExit('expected validator text not found')
          p.write_text(text.replace(old,new,1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/auth/DriverInviteAuthScreen.tsx
          git commit -m "fix allow existing email users to sign in"
          git push origin HEAD:fix/email-password-auth-ux
