name: Finalizar numeros de movil en fila

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-blank-mobile-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Usar la fila del servidor como fuente del numero de movil
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/modules/OperatorConsole.tsx')
          text = path.read_text(encoding='utf-8')
          old = "    .filter((item) => item.status === 'available' && isQueueConnected(item) && !activeTripDriverIds.has(item.driverId))"
          new = "    .filter((item) => Boolean(item.unitNumber.trim()) && item.status === 'available' && isQueueConnected(item) && !activeTripDriverIds.has(item.driverId))"
          if old not in text: raise SystemExit('Filtro de disponibles no encontrado')
          text = text.replace(old, new, 1)
          old = "  const queueDrivers = useMemo(() => queueItems\n    .filter((item) => activeTripDriverIds.has(item.driverId) || item.serviceEnabled || item.status === 'offline')"
          new = "  const queueDrivers = useMemo(() => queueItems\n    .filter((item) => Boolean(item.unitNumber.trim()))\n    .filter((item) => activeTripDriverIds.has(item.driverId) || item.serviceEnabled || item.status === 'offline')"
          if old not in text: raise SystemExit('Filtro principal de fila no encontrado')
          text = text.replace(old, new, 1)
          old = "    .map((item) => drivers.find((driver) => driver.id === item.driverId))"
          new = "    .map((item) => {\n      const driver = drivers.find((candidate) => candidate.id === item.driverId);\n      return driver ? { ...driver, unitNumber: item.unitNumber } : undefined;\n    })"
          if text.count(old) < 2: raise SystemExit('Mapeo de movil esperado no encontrado dos veces')
          text = text.replace(old, new, 2)
          old = "      .filter((item) => item.serviceEnabled && item.status !== 'offline' && item.status !== 'sos')"
          new = "      .filter((item) => Boolean(item.unitNumber.trim()) && item.serviceEnabled && item.status !== 'offline' && item.status !== 'sos')"
          if old not in text: raise SystemExit('Numeracion visible de fila no encontrada')
          text = text.replace(old, new, 1)
          old = "  const manualDriversManageable = useMemo(() => queueItems\n    .filter((item) => !activeTripDriverIds.has(item.driverId))"
          new = "  const manualDriversManageable = useMemo(() => queueItems\n    .filter((item) => Boolean(item.unitNumber.trim()))\n    .filter((item) => !activeTripDriverIds.has(item.driverId))"
          if old not in text: raise SystemExit('Gestion manual no encontrada')
          text = text.replace(old, new, 1)
          old = "const noAppDriverCount = useMemo(() => queueItems.filter((item) => !item.userId).length, [queueItems]);"
          new = "const noAppDriverCount = useMemo(() => queueItems.filter((item) => Boolean(item.unitNumber.trim()) && !item.userId).length, [queueItems]);"
          if old not in text: raise SystemExit('Contador sin app no encontrado')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Registrar la migracion aplicada en produccion
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/migrations/20260905060943_harden_blank_mobile_queue.sql <<'SQL'
          -- Prevent incomplete driver records from becoming visible/dispatchable queue mobiles.
          -- Existing onboarding rows without a selected vehicle may remain OFFLINE, but
          -- no active driver state may exist without a real mobile number.

          update public.drivers
          set status = 'offline'::public.centralgo_driver_status,
              service_enabled = false,
              updated_at = now()
          where nullif(btrim(coalesce(unit_number,'')),'') is null
            and (status::text <> 'offline' or service_enabled);

          alter table public.drivers
            drop constraint if exists drivers_active_status_requires_mobile_number;

          alter table public.drivers
            add constraint drivers_active_status_requires_mobile_number
            check (
              status::text = 'offline'
              or nullif(btrim(coalesce(unit_number,'')),'') is not null
            );

          create or replace function public.centralgo_operator_set_driver_daily_service(
            p_driver_id uuid,
            p_enabled boolean,
            p_mode text default null::text
          )
          returns public.drivers
          language plpgsql
          security definer
          set search_path = public
          as $$
          declare
            d public.drivers%rowtype;
            requested_mode text;
            next_mode text;
            manual_toggle boolean;
            joining_manual boolean;
            next_queue_order bigint;
          begin
            select * into d
            from public.drivers
            where id = p_driver_id;

            if not found then
              raise exception 'Conductor no encontrado' using errcode='P0002';
            end if;

            if not public.centralgo_has_company_role(
              d.company_id,
              array['company_admin','operator']::public.centralgo_company_role[]
            ) and not public.centralgo_is_super_admin() then
              raise exception 'Sin permiso para controlar el turno de este móvil' using errcode='42501';
            end if;

            perform pg_advisory_xact_lock(hashtext(d.company_id::text)::bigint);

            select * into d
            from public.drivers
            where id = p_driver_id
            for update;

            if exists(
              select 1 from public.trips t
              where t.driver_id=d.id
                and t.status in ('assigned','en_route','arrived','in_progress')
            ) then
              raise exception 'No puedes cambiar el turno mientras el móvil tiene una carrera activa' using errcode='55000';
            end if;

            requested_mode := coalesce(p_mode, d.operation_mode, 'app');
            if requested_mode not in ('app','traditional') then
              raise exception 'Modo de operación no permitido' using errcode='22023';
            end if;

            if p_enabled and nullif(btrim(coalesce(d.unit_number,'')),'') is null then
              raise exception 'Este conductor no tiene número de móvil. Asigna un vehículo o número antes de incorporarlo a la fila' using errcode='22023';
            end if;

            manual_toggle := p_mode = 'traditional';

            next_mode := case
              when manual_toggle and not p_enabled then 'app'
              else requested_mode
            end;

            joining_manual := p_enabled
              and requested_mode='traditional'
              and (
                d.operation_mode is distinct from 'traditional'
                or not coalesce(d.service_enabled,false)
                or d.status<>'available'
              );

            if joining_manual then
              select coalesce(max(other.dispatch_queue_order),0)+1
                into next_queue_order
              from public.drivers other
              where other.company_id=d.company_id
                and other.id<>d.id
                and other.archived_at is null;
            else
              next_queue_order := d.dispatch_queue_order;
            end if;

            if requested_mode='traditional' then
              update public.driver_presence_sessions
                set last_seen_at=now(), ended_at=now()
              where driver_id=d.id and ended_at is null;
            end if;

            update public.drivers
            set operation_mode = next_mode,
                service_enabled = case when manual_toggle then true else p_enabled end,
                status = case
                  when manual_toggle and not p_enabled then 'offline'::public.centralgo_driver_status
                  when not p_enabled then 'offline'::public.centralgo_driver_status
                  when next_mode='traditional' then 'available'::public.centralgo_driver_status
                  when d.status='offline' then 'offline'::public.centralgo_driver_status
                  else d.status
                end,
                dispatch_queue_order = next_queue_order,
                dispatch_queue_updated_at = case when joining_manual then now() else d.dispatch_queue_updated_at end,
                service_control_updated_at = now(),
                updated_at = now()
            where id=d.id
            returning * into d;

            return d;
          end;
          $$;
          SQL

      - name: Agregar regresion para moviles sin numero
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/tests/blank-mobile-queue-regression.sql <<'SQL'
          \set ON_ERROR_STOP on
          begin;

          insert into auth.users(id,email,email_confirmed_at,raw_user_meta_data)
          values ('f1000000-0000-4000-8000-000000000001','blank-mobile-operator@centralgo.test',now(),'{"name":"Operador Blank Mobile"}');

          insert into public.companies(id,name,code,active)
          values ('f2000000-0000-4000-8000-000000000001','Central Blank Mobile','BLANK-MOBILE',true);

          insert into public.company_memberships(company_id,user_id,role,active)
          values ('f2000000-0000-4000-8000-000000000001','f1000000-0000-4000-8000-000000000001','operator',true);

          insert into public.drivers(
            id,company_id,user_id,vehicle_id,unit_number,display_name,license_number,
            status,operation_mode,service_enabled
          ) values (
            'f4000000-0000-4000-8000-000000000001','f2000000-0000-4000-8000-000000000001',null,null,'',
            'Conductor sin móvil','LIC-BLANK-MOBILE','offline','app',true
          );

          set local role authenticated;
          set local request.jwt.claim.sub='f1000000-0000-4000-8000-000000000001';

          do $$
          begin
            begin
              perform public.centralgo_operator_set_driver_daily_service(
                'f4000000-0000-4000-8000-000000000001',true,'traditional'
              );
              raise exception 'BLANK MOBILE FAIL: se activo un conductor sin numero de movil';
            exception when sqlstate '22023' then
              null;
            end;

            if exists (
              select 1 from public.drivers
              where id='f4000000-0000-4000-8000-000000000001'
                and status<>'offline'
            ) then
              raise exception 'BLANK MOBILE FAIL: el RPC dejo activo al conductor incompleto';
            end if;
          end $$;

          reset role;

          do $$
          begin
            begin
              update public.drivers
              set status='available'::public.centralgo_driver_status
              where id='f4000000-0000-4000-8000-000000000001';
              raise exception 'BLANK MOBILE FAIL: el constraint permitio estado activo sin numero';
            exception when check_violation then
              null;
            end;
          end $$;

          rollback;
          SQL
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/operator-chaos.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - name: Romper la app como usuarios torpes\n        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/operator-chaos-misuse.sql\n"
          addition = "      - name: Impedir moviles activos sin numero\n        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/blank-mobile-queue-regression.sql\n"
          if anchor not in text: raise SystemExit('Paso final del workflow de caos no encontrado')
          path.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')
          PY

      - name: Validar TypeScript contratos y build
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test

      - name: Publicar correccion
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/harden-blank-mobile-queue.yml
          git config user.name "central-go-automation"
          git config user.email "central-go-automation@users.noreply.github.com"
          git add src/components/modules/OperatorConsole.tsx supabase/migrations/20260905060943_harden_blank_mobile_queue.sql supabase/tests/blank-mobile-queue-regression.sql .github/workflows/operator-chaos.yml
          git commit -m "fix(queue): keep mobile numbers authoritative and reject blank units"
          git push
