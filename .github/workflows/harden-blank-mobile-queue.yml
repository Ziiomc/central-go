name: Finalizar numeros de movil en fila

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/harden-blank-mobile-queue.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir fuente visual de numeros de movil
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/modules/OperatorConsole.tsx')
          text = path.read_text(encoding='utf-8')
          old = "    .filter((item) => item.status === 'available' && isQueueConnected(item) && !activeTripDriverIds.has(item.driverId))"
          new = "    .filter((item) => Boolean(item.unitNumber.trim()) && item.status === 'available' && isQueueConnected(item) && !activeTripDriverIds.has(item.driverId))"
          if old not in text: raise SystemExit('Filtro de disponibles no encontrado')
          text = text.replace(old, new, 1)
          old = "  const queueDrivers = useMemo(() => queueItems\n    .filter((item) => activeTripDriverIds.has(item.driverId) || item.serviceEnabled || item.status === 'offline')"
          new = "  const queueDrivers = useMemo(() => queueItems\n    .filter((item) => Boolean(item.unitNumber.trim()))\n    .filter((item) => activeTripDriverIds.has(item.driverId) || item.serviceEnabled || item.status === 'offline')"
          if old not in text: raise SystemExit('Filtro principal de fila no encontrado')
          text = text.replace(old, new, 1)
          old = "    .map((item) => drivers.find((driver) => driver.id === item.driverId))"
          new = "    .map((item) => {\n      const driver = drivers.find((candidate) => candidate.id === item.driverId);\n      return driver ? { ...driver, unitNumber: item.unitNumber } : undefined;\n    })"
          if text.count(old) < 2: raise SystemExit('Mapeo de movil esperado no encontrado dos veces')
          text = text.replace(old, new, 2)
          old = "      .filter((item) => item.serviceEnabled && item.status !== 'offline' && item.status !== 'sos')"
          new = "      .filter((item) => Boolean(item.unitNumber.trim()) && item.serviceEnabled && item.status !== 'offline' && item.status !== 'sos')"
          if old not in text: raise SystemExit('Numeracion visible de fila no encontrada')
          text = text.replace(old, new, 1)
          old = "  const manualDriversManageable = useMemo(() => queueItems\n    .filter((item) => !activeTripDriverIds.has(item.driverId))"
          new = "  const manualDriversManageable = useMemo(() => queueItems\n    .filter((item) => Boolean(item.unitNumber.trim()))\n    .filter((item) => !activeTripDriverIds.has(item.driverId))"
          if old not in text: raise SystemExit('Gestion manual no encontrada')
          text = text.replace(old, new, 1)
          old = "const noAppDriverCount = useMemo(() => queueItems.filter((item) => !item.userId).length, [queueItems]);"
          new = "const noAppDriverCount = useMemo(() => queueItems.filter((item) => Boolean(item.unitNumber.trim()) && !item.userId).length, [queueItems]);"
          if old not in text: raise SystemExit('Contador sin app no encontrado')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Probar frontend y contratos
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm test
      - name: Publicar frontend corregido
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "central-go-automation"
          git config user.email "central-go-automation@users.noreply.github.com"
          git add src/components/modules/OperatorConsole.tsx
          git commit -m "fix(queue): render authoritative mobile numbers"
          git push
