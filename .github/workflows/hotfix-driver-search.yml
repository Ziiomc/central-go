name: Apply fast driver assignment hotfix

on:
  push:
    paths:
      - '.github/workflows/hotfix-driver-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch NewTripModal
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/modals/NewTripModal.tsx')
          s = p.read_text()

          old_state = "[driverId,setDriverId]=useState(''),[queueOnly,setQueueOnly]=useState(false),[km,setKm]"
          new_state = "[driverId,setDriverId]=useState(''),[driverSearch,setDriverSearch]=useState(''),[queueOnly,setQueueOnly]=useState(false),[km,setKm]"
          assert old_state in s
          s = s.replace(old_state, new_state, 1)

          old_reset = "setVehicleType('standard');setDriverId('');setQueueOnly(false);setKm(0);"
          new_reset = "setVehicleType('standard');setDriverId('');setDriverSearch('');setQueueOnly(false);setKm(0);"
          assert old_reset in s
          s = s.replace(old_reset, new_reset, 1)

          old_available = " const available=useMemo(()=>drivers.filter(d=>d.status==='available'&&!blockedDriverIds.has(d.id)),[drivers,blockedDriverIds]);\n const calculated="
          new_available = " const available=useMemo(()=>drivers.filter(d=>d.status==='available'&&!blockedDriverIds.has(d.id)),[drivers,blockedDriverIds]);\n const driverMatches=useMemo(()=>{const q=norm(driverSearch);if(!q)return[];return available.filter(d=>norm(d.unitNumber).includes(q)||norm(d.name).includes(q)).slice(0,6);},[available,driverSearch]);\n const quickDrivers=useMemo(()=>available.slice(0,8),[available]);\n const chooseDriver=(id:string)=>{const d=available.find(x=>x.id===id);if(!d)return;setDriverId(d.id);setDriverSearch(d.unitNumber);setQueueOnly(false);setError('');};\n const handleDriverSearchKey=(e:React.KeyboardEvent<HTMLInputElement>)=>{if(e.key!=='Enter')return;e.preventDefault();const q=norm(driverSearch);const exact=available.find(d=>norm(d.unitNumber)===q);const match=exact??driverMatches[0];if(match)chooseDriver(match.id);};\n const calculated="
          assert old_available in s
          s = s.replace(old_available, new_available, 1)

          old_ui = "      <div className=\"mt-2 flex gap-2 overflow-x-auto pb-1\"><button type=\"button\" onClick={()=>{setDriverId('');setQueueOnly(false);}} className={`shrink-0 rounded-lg border px-3 py-2 text-[11px] font-black ${driverId===''?'border-amber-300 bg-amber-400 text-zinc-950':'border-zinc-700 bg-zinc-900 text-zinc-300'}`}>Automático equitativo</button>{!scheduled&&available.map(d=><button key={d.id} type=\"button\" onClick={()=>{setDriverId(d.id);setQueueOnly(false);}} className={`shrink-0 rounded-lg border px-3 py-2 text-[11px] font-bold ${driverId===d.id?'border-blue-400 bg-blue-600 text-white':'border-zinc-700 bg-zinc-900 text-zinc-300'}`}>{d.unitNumber} · {d.name.split(' ')[0]}</button>)}</div>\n      <div className=\"mt-2 flex flex-wrap items-center gap-2\"><button type=\"button\" onClick={()=>{setQueueOnly(v=>!v);setDriverId('');}} className={`rounded-lg border px-3 py-2 text-[11px] font-black ${queueOnly?'border-cyan-300 bg-cyan-500 text-zinc-950':'border-cyan-700/60 bg-cyan-950/40 text-cyan-200'}`}>Poner a la cola</button><span className=\"text-[9px] text-zinc-500\">Guarda la llamada sin asignarla para seguir atendiendo. Después se despacha desde la cola respetando el orden.</span></div>{clientId&&blockedDriverIds.size>0&&<p className=\"mt-1.5 text-[9px] text-rose-300\">{blockedDriverIds.size} móvil(es) excluido(s) por preferencia del cliente.</p>}"

          new_ui = "      <div className=\"mt-2 flex flex-wrap gap-2\"><button type=\"button\" onClick={()=>{setDriverId('');setDriverSearch('');setQueueOnly(false);}} className={`rounded-lg border px-3 py-2 text-[11px] font-black ${driverId===''&&!queueOnly?'border-amber-300 bg-amber-400 text-zinc-950':'border-zinc-700 bg-zinc-900 text-zinc-300'}`}>Automático equitativo</button><button type=\"button\" onClick={()=>{setQueueOnly(v=>!v);setDriverId('');setDriverSearch('');}} className={`rounded-lg border px-3 py-2 text-[11px] font-black ${queueOnly?'border-cyan-300 bg-cyan-500 text-zinc-950':'border-cyan-700/60 bg-cyan-950/40 text-cyan-200'}`}>Poner a la cola</button></div>\n      {!scheduled&&<div className=\"mt-3 rounded-xl border border-zinc-800 bg-zinc-950/55 p-3\"><div className=\"flex flex-wrap items-center justify-between gap-2\"><div><p className=\"text-[10px] font-black uppercase tracking-wider text-zinc-400\">Asignar móvil</p><p className=\"mt-0.5 text-[9px] text-zinc-600\">Escribe el número del móvil. Enter selecciona la primera coincidencia.</p></div>{driverId&&<span className=\"rounded-full border border-blue-500/25 bg-blue-500/10 px-2.5 py-1 text-[10px] font-black text-blue-200\">Seleccionado: {available.find(d=>d.id===driverId)?.unitNumber}</span>}</div><div className=\"relative mt-2\"><input inputMode=\"numeric\" autoComplete=\"off\" value={driverSearch} onChange={e=>{const value=e.target.value;setDriverSearch(value);setDriverId('');setQueueOnly(false);const exact=available.find(d=>norm(d.unitNumber)===norm(value));if(exact)chooseDriver(exact.id);}} onKeyDown={handleDriverSearchKey} placeholder=\"Ej: 94\" className={`${inputClass} pr-10 text-sm font-black`}/>{driverSearch&&<button type=\"button\" onClick={()=>{setDriverSearch('');setDriverId('');}} className=\"absolute inset-y-0 right-0 grid w-10 place-items-center text-zinc-500 hover:text-white\" aria-label=\"Limpiar móvil\"><X className=\"h-4 w-4\"/></button>}</div>{driverSearch&&driverMatches.length>0&&<div className=\"mt-2 grid gap-1 sm:grid-cols-2\">{driverMatches.map((d,index)=><button key={d.id} type=\"button\" onClick={()=>chooseDriver(d.id)} className={`flex items-center justify-between rounded-lg border px-3 py-2 text-left ${driverId===d.id?'border-blue-400 bg-blue-600/20':'border-zinc-800 bg-zinc-900/80 hover:border-zinc-600'}`}><span><strong className=\"text-xs text-white\">Móvil {d.unitNumber}</strong><span className=\"ml-2 text-[10px] text-zinc-500\">{d.name}</span></span><span className=\"text-[9px] font-black text-emerald-300\">{index===0?'Enter · ':''}Libre</span></button>)}</div>}{driverSearch&&driverMatches.length===0&&<p className=\"mt-2 rounded-lg border border-amber-500/20 bg-amber-500/10 px-3 py-2 text-[10px] font-bold text-amber-200\">No hay un móvil libre que coincida con “{driverSearch}”.</p>}<div className=\"mt-3\"><p className=\"mb-1.5 text-[9px] font-black uppercase tracking-wider text-zinc-600\">Acceso rápido · primeros en la fila</p><div className=\"flex gap-1.5 overflow-x-auto pb-1\">{quickDrivers.map((d,index)=><button key={d.id} type=\"button\" onClick={()=>chooseDriver(d.id)} title={`${index+1}° en la fila · ${d.name}`} className={`shrink-0 rounded-lg border px-3 py-2 text-[11px] font-black ${driverId===d.id?'border-blue-400 bg-blue-600 text-white':'border-zinc-700 bg-zinc-900 text-zinc-300'}`}>{d.unitNumber}</button>)}{available.length>quickDrivers.length&&<span className=\"shrink-0 rounded-lg border border-dashed border-zinc-700 px-3 py-2 text-[10px] font-bold text-zinc-500\">+{available.length-quickDrivers.length} más</span>}</div></div></div>}\n      <p className=\"mt-2 text-[9px] text-zinc-500\">Poner a la cola guarda la llamada sin asignarla para seguir atendiendo. Después se despacha respetando el orden.</p>{clientId&&blockedDriverIds.size>0&&<p className=\"mt-1.5 text-[9px] text-rose-300\">{blockedDriverIds.size} móvil(es) excluido(s) por preferencia del cliente.</p>}"
          assert old_ui in s
          s = s.replace(old_ui, new_ui, 1)

          p.write_text(s)
      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/modals/NewTripModal.tsx
          git commit -m "Speed up manual driver assignment by unit number"
          git push origin main
