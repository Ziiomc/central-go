name: Apply persistent queue mode
on:
  push:
    paths:
      - '.github/workflows/hotfix-queue-default.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch queue workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/modals/NewTripModal.tsx')
          s=p.read_text()
          s=s.replace("[queueOnly,setQueueOnly]=useState(false)","[queueOnly,setQueueOnly]=useState(true)")
          s=s.replace("setDriverSearch('');setQueueOnly(false);setKm(0)","setDriverSearch('');setQueueOnly(true);setKm(0)")
          s=s.replace("const handleDriverSearchKey=(e:React.KeyboardEvent<HTMLInputElement>)=>{if(e.key!=='Enter')return;e.preventDefault();const q=norm(driverSearch);const exact=available.find(d=>norm(d.unitNumber)===q);const match=exact??driverMatches[0];if(match)chooseDriver(match.id);};", "const handleDriverSearchKey=(e:React.KeyboardEvent<HTMLInputElement>)=>{if(e.key!=='Enter')return;e.preventDefault();const q=norm(driverSearch);const exact=available.find(d=>norm(d.unitNumber)===q);const match=exact??driverMatches[0];if(match)chooseDriver(match.id);};\n const handleFormKeyDown=(e:React.KeyboardEvent<HTMLFormElement>)=>{if(e.key!=='Enter'||e.shiftKey||e.ctrlKey||e.altKey||e.metaKey)return;const target=e.target as HTMLElement;if(target.tagName==='BUTTON'||target.tagName==='TEXTAREA')return;if(driverSearch&&document.activeElement?.getAttribute('inputmode')==='numeric')return;e.preventDefault();e.currentTarget.requestSubmit();};")
          s=s.replace('<form onSubmit={submit} className="flex min-h-0 flex-1 flex-col">','<form onSubmit={submit} onKeyDown={handleFormKeyDown} className="flex min-h-0 flex-1 flex-col">')
          s=s.replace("onClick={()=>{setDriverId('');setDriverSearch('');setQueueOnly(false);}}", "onClick={()=>{setDriverId('');setDriverSearch('');setQueueOnly(false);}}")
          s=s.replace("onClick={()=>{setQueueOnly(v=>!v);setDriverId('');setDriverSearch('');}}", "onClick={()=>{setQueueOnly(v=>!v);setDriverId('');setDriverSearch('');}}")
          s=s.replace('>Poner a la cola</button></div>',">Modo cola {queueOnly?'ACTIVO':'INACTIVO'}</button></div>")
          s=s.replace('Poner a la cola guarda la llamada sin asignarla para seguir atendiendo. Después se despacha respetando el orden.','Modo cola funciona como interruptor y queda activo entre carreras. Con el modo activo, Enter guarda la llamada en la cola para seguir atendiendo; desactívalo para despacho automático.')
          s=s.replace("queueOnly?'Poner a la cola':'Despachar carrera'", "queueOnly?'Guardar en cola · Enter':'Despachar carrera · Enter'")
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/modals/NewTripModal.tsx
          git commit -m 'Make queue mode persistent and save with Enter' || exit 0
          git push origin main