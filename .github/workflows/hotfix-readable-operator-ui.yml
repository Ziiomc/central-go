name: Check operator console readability

on:
  pull_request:
    paths:
      - 'src/components/modules/OperatorConsole.tsx'
      - 'src/components/modals/NewTripModal.tsx'
      - '.github/workflows/hotfix-readable-operator-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run check:commercial
