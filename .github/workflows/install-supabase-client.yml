name: Instalar cliente Supabase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-supabase-client.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar SDK Supabase
        run: npm install @supabase/supabase-js --save --no-audit --no-fund
      - name: Publicar package y lock
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Añadir cliente oficial Supabase"
          git pull --rebase origin main
          git push origin HEAD:main
