name: Main autonomous UI hardening

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main-autonomous-ui-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Refine tablet dispatch layout
        run: python3 scripts/refine-operator-tablet-layout.py
      - name: Install dependencies
        run: npm ci
      - name: Verify full app
        run: npm test
      - name: Commit verified app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/modules/OperatorConsole.tsx reporte_mejoras_aplicadas.md
          git commit -m 'fix: preserve dispatch hierarchy on tablets'
          git push origin HEAD:main
