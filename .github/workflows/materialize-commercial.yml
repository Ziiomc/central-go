name: Materializar fuente comercial Central GO

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-commercial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materializar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Aplicar todas las capas actuales
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            network-bootstrap.mjs \
            pricing-bootstrap.mjs \
            operator-layout-bootstrap.mjs \
            operations-pro-bootstrap.mjs \
            road-routes-bootstrap.mjs \
            selection-fix-bootstrap.mjs
          do
            if [ -f "$script" ]; then
              node "$script"
            fi
          done

      - name: Convertir a fuente estable
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .network .pricing .operator-layout .operations-pro .road-routes .selection-fix
          rm -f network-bootstrap.mjs pricing-bootstrap.mjs operator-layout-bootstrap.mjs operations-pro-bootstrap.mjs road-routes-bootstrap.mjs selection-fix-bootstrap.mjs
          rm -f .github/workflows/unpack.yml
          node <<'NODE'
          const fs = require('fs');

          const contextPath = 'src/context/AppContext.tsx';
          let context = fs.readFileSync(contextPath, 'utf8');
          if (!context.includes('addAuditLog: (action: string, description: string) => void;')) {
            context = context.replace(
              '  clearAllNotifications: () => void;\n}',
              "  clearAllNotifications: () => void;\n  addAuditLog: (action: string, description: string) => void;\n  addNotification: (title: string, message: string, type: AppNotification['type'], relatedId?: string) => void;\n}"
            );
            fs.writeFileSync(contextPath, context);
          }

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '1.6.0';
          pkg.scripts = {
            dev: 'vite --port=3000 --host=0.0.0.0',
            build: 'vite build',
            preview: 'vite preview --host=0.0.0.0',
            clean: 'rm -rf dist',
            lint: 'tsc --noEmit'
          };
          pkg.description = 'Central GO 1.6 - base comercial estable sin capas de build autogeneradas.';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          rm -f .github/workflows/materialize-commercial.yml

      - name: Validar fuente materializada
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build

      - name: Publicar fuente estable
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios para publicar."
            exit 0
          fi
          git commit -m "Materializar Central GO 1.6 para base comercial"
          git pull --rebase origin main
          git push origin HEAD:main
