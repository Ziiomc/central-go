name: Migrate Central GO to OpenFreeMap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-openfreemap.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install OpenFreeMap renderer
        run: npm install --save maplibre-gl@^6.6.0 @maplibre/maplibre-gl-leaflet@^0.1.4

      - name: Patch live map, demo map and CSP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          live = Path('src/components/map/LiveMap.tsx')
          text = live.read_text()

          leaflet_import = "import L from 'leaflet';\n"
          assert leaflet_import in text, 'Leaflet import not found in LiveMap'
          text = text.replace(leaflet_import, leaflet_import + "import { maplibreGL } from '@maplibre/maplibre-gl-leaflet';\nimport 'maplibre-gl/dist/maplibre-gl.css';\n", 1)

          props_anchor = "interface LiveMapProps {"
          assert props_anchor in text, 'LiveMapProps anchor not found'
          styles = "const OPENFREEMAP_STYLES = {\n  dark: 'https://tiles.openfreemap.org/styles/dark',\n  street: 'https://tiles.openfreemap.org/styles/liberty',\n} as const;\n\n"
          text = text.replace(props_anchor, styles + props_anchor, 1)

          map_ref = "  const mapInstanceRef = useRef<L.Map | null>(null);\n"
          assert map_ref in text, 'mapInstanceRef anchor not found'
          text = text.replace(map_ref, map_ref + "  const baseLayerRef = useRef<L.Layer | null>(null);\n", 1)

          init_start = text.index("    const map = L.map(mapContainerRef.current")
          init_end_marker = "    mapInstanceRef.current = map;"
          init_end = text.index(init_end_marker, init_start) + len(init_end_marker)
          init_replacement = "    const map = L.map(mapContainerRef.current, { center: defaultCenter, zoom: 14, zoomControl: false });\n    L.control.zoom({ position: 'bottomright' }).addTo(map);\n    map.attributionControl.addAttribution('OpenFreeMap © OpenMapTiles · Datos © OpenStreetMap contributors');\n    mapInstanceRef.current = map;"
          text = text[:init_start] + init_replacement + text[init_end:]

          cleanup = "      resizeObserver.disconnect();\n      map.remove();"
          assert cleanup in text, 'Map cleanup anchor not found'
          text = text.replace(cleanup, "      resizeObserver.disconnect();\n      baseLayerRef.current = null;\n      map.remove();", 1)

          tile_anchor = "    map.eachLayer((layer) => { if (layer instanceof L.TileLayer) map.removeLayer(layer); });"
          tile_mid = text.index(tile_anchor)
          tile_start = text.rfind("  useEffect(() => {", 0, tile_mid)
          tile_end_marker = "  }, [tileMode]);"
          tile_end = text.index(tile_end_marker, tile_mid) + len(tile_end_marker)
          tile_effect = "  useEffect(() => {\n    const map = mapInstanceRef.current;\n    if (!map) return;\n    baseLayerRef.current?.remove();\n    baseLayerRef.current = maplibreGL({\n      style: OPENFREEMAP_STYLES[tileMode],\n      attributionControl: false,\n    }).addTo(map);\n    return () => {\n      baseLayerRef.current?.remove();\n      baseLayerRef.current = null;\n    };\n  }, [tileMode]);"
          text = text[:tile_start] + tile_effect + text[tile_end:]

          assert 'cartocdn.com' not in text, 'CARTO URL still present in LiveMap after patch'
          live.write_text(text)

          demo = Path('src/components/demo/SalesDemoScreen.tsx')
          dtext = demo.read_text()
          demo_leaflet = "import L from 'leaflet';\n"
          assert demo_leaflet in dtext, 'Leaflet import not found in SalesDemoScreen'
          dtext = dtext.replace(demo_leaflet, demo_leaflet + "import { maplibreGL } from '@maplibre/maplibre-gl-leaflet';\nimport 'maplibre-gl/dist/maplibre-gl.css';\n", 1)

          demo_start = dtext.index("    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'")
          demo_end_marker = "    }).addTo(map);"
          demo_end = dtext.index(demo_end_marker, demo_start) + len(demo_end_marker)
          demo_replacement = "    maplibreGL({ style: 'https://tiles.openfreemap.org/styles/dark', attributionControl: false }).addTo(map);\n    map.attributionControl.addAttribution('OpenFreeMap © OpenMapTiles · Datos © OpenStreetMap contributors');"
          dtext = dtext[:demo_start] + demo_replacement + dtext[demo_end:]
          assert 'cartocdn.com' not in dtext, 'CARTO URL still present in SalesDemoScreen after patch'
          demo.write_text(dtext)

          vercel = Path('vercel.json')
          vtext = vercel.read_text()
          csp_old = "https://router.project-osrm.org; font-src"
          csp_new = "https://router.project-osrm.org https://tiles.openfreemap.org; font-src"
          assert csp_old in vtext, 'CSP connect-src anchor not found'
          vercel.write_text(vtext.replace(csp_old, csp_new, 1))
          PY

      - name: Verify CARTO is removed
        run: |
          if grep -RIn --exclude-dir=node_modules --exclude-dir=.git 'cartocdn.com\|&copy; CARTO' src vercel.json; then
            echo 'CARTO references remain' >&2
            exit 1
          fi

      - name: Run full test suite
        run: npm test

      - name: Commit migration
        run: |
          git config user.name 'central-go-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/map/LiveMap.tsx src/components/demo/SalesDemoScreen.tsx package.json package-lock.json vercel.json
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'fix: migrate maps from CARTO to OpenFreeMap'
          git push origin HEAD:main
