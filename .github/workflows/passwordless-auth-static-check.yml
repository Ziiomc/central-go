name: Passwordless auth static check

on:
  push:
    branches:
      - fix/passwordless-email-access

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: TypeScript and build
        run: |
          npm run lint
          npm run build
      - name: Verify passwordless paths
        run: |
          grep -q "signInWithOtp" src/components/auth/DriverInviteAuthScreen.tsx
          grep -q "shouldCreateUser:mode==='register'" src/components/auth/DriverInviteAuthScreen.tsx
          grep -q "signInWithOtp" src/components/auth/LoginScreenBase.tsx
          grep -q "shouldCreateUser: mode === 'register'" src/components/auth/LoginScreenBase.tsx
          grep -q "Crear cuenta sólo con correo" src/components/auth/DriverInviteAuthScreen.tsx
          grep -q "Crear cuenta sólo con correo" src/components/auth/LoginScreenBase.tsx
