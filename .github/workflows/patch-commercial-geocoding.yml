name: Conectar geocodificación comercial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-commercial-geocoding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-commercial-geocoding.mjs
      - run: rm -f scripts/patch-commercial-geocoding.mjs
      - name: Publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/patch-commercial-geocoding.mjs
          git commit -m "Usar geocodificación real en despacho comercial"
          git pull --rebase origin main
          git push origin HEAD:main
