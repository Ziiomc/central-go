name: Post-release visual smoke Central GO

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/post-release-visual-smoke-temporary.yml'

permissions:
  contents: read

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install isolated browser tools
        run: |
          npm ci
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Build post-release visual spec from audited fixture history
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          source = subprocess.check_output([
              'git', 'show',
              'c9354b1ed63f55c3d9c38313aeb61c602573c053:.github/workflows/qa-visual-temporary.yml',
          ], text=True)
          start_marker = "          cat > qa-visual.spec.cjs <<'TEST'\n"
          end_marker = "\n          TEST\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          spec = source[start:end]
          spec = spec.replace("test.describe.configure({ mode: 'serial' });", "// independent release scenarios")

          # Make the historical date-only suffix unique for this run without
          # embedding, exposing or logging the fixture credentials.
          unique_stamp = "const stamp = new Date().toISOString().replace(/[^0-9]/g, '').slice(2, 14);"
          spec, stamp_count = re.subn(r"const\s+stamp\s*=\s*[^;]+;", unique_stamp, spec, count=1)
          if stamp_count != 1:
              raise SystemExit('Expected QA timestamp declaration not found in visual fixture.')

          old = "            await page.getByLabel('Cerrar', { exact: true }).click();\n\n            const operatorsNav = page.getByText('Operadores', { exact: true }).first();"
          new = "            await page.getByLabel('Cerrar', { exact: true }).click();\n\n            await page.getByLabel('Abrir menú principal').click();\n            const operatorsNav = page.getByText('Operadores', { exact: true }).first();"
          if "await page.getByLabel('Abrir menú principal').click();" not in spec:
              if old not in spec:
                  raise SystemExit('Expected operator navigation not found in historical visual fixture.')
              spec = spec.replace(old, new, 1)
          spec = spec.replace("getByText('Operadores', { exact: true })", "getByText('Operadores/as', { exact: true })")
          Path('post-release-visual.spec.cjs').write_text(spec)
      - name: Run production visual smoke
        run: npx playwright test post-release-visual.spec.cjs --workers=1 --reporter=line
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-go-post-release-visual
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.md
          if-no-files-found: warn
          retention-days: 3
