name: QA patch visual navigation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-visual-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/operator-stress-audit
          fetch-depth: 0

      - name: Abrir sidebar antes de navegar a Operadores
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/qa-visual-temporary.yml')
          text = path.read_text()
          marker = "            await page.getByLabel('Abrir menú principal').click();\n"
          if marker in text:
              print('El parche visual ya estaba aplicado.')
              raise SystemExit(0)

          old = "            await page.getByLabel('Cerrar', { exact: true }).click();\n\n            const operatorsNav = page.getByText('Operadores', { exact: true }).first();"
          new = "            await page.getByLabel('Cerrar', { exact: true }).click();\n\n            await page.getByLabel('Abrir menú principal').click();\n            const operatorsNav = page.getByText('Operadores', { exact: true }).first();"
          if old not in text:
              raise SystemExit('No se encontró el punto de navegación esperado.')
          path.write_text(text.replace(old, new, 1))

      - name: Publicar ajuste del guion QA
        shell: bash
        run: |
          if git diff --quiet -- .github/workflows/qa-visual-temporary.yml; then
            echo 'Sin cambios pendientes.'
            exit 0
          fi
          git config user.name 'central-go-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/qa-visual-temporary.yml
          git commit -m 'test: open sidebar before operator navigation'
          git push origin HEAD:qa/operator-stress-audit
