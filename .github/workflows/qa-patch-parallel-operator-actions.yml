name: QA patch parallel operator actions

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/operator-stress-audit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Permitir operaciones simultáneas en carreras distintas
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/components/modules/OperatorConsole.tsx')
          text = path.read_text()

          if 'busyTripIdsRef' in text:
              print('La corrección ya estaba aplicada.')
              raise SystemExit(0)

          text, state_count = re.subn(
              r"  const \[busyTripId, setBusyTripId\] = useState<string \| null>\(null\);",
              "  const busyTripIdsRef = useRef<Set<string>>(new Set());\n  const [busyTripIds, setBusyTripIds] = useState<Set<string>>(() => new Set());",
              text,
              count=1,
          )

          action_pattern = re.compile(
              r"  const runTripAction = async \(tripId: string, action: \(\) => Promise<unknown> \| unknown\) => \{.*?\n  \};\n\n  const assignDriverToTrip",
              re.S,
          )
          action_replacement = """  const runTripAction = async (tripId: string, action: () => Promise<unknown> | unknown) => {
            if (busyTripIdsRef.current.has(tripId)) return;
            busyTripIdsRef.current.add(tripId);
            setBusyTripIds(new Set(busyTripIdsRef.current));
            try {
              await Promise.resolve(action());
            } catch (error) {
              window.alert(error instanceof Error ? error.message : 'No fue posible completar la operación.');
            } finally {
              busyTripIdsRef.current.delete(tripId);
              setBusyTripIds(new Set(busyTripIdsRef.current));
            }
          };

          const assignDriverToTrip"""
          text, action_count = action_pattern.subn(action_replacement, text, count=1)

          text, render_count = re.subn(
              r"const isBusy = busyTripId === trip\.id;",
              "const isBusy = busyTripIds.has(trip.id);",
              text,
              count=1,
          )

          if (state_count, action_count, render_count) != (1, 1, 1):
              raise SystemExit(f'Parche incompleto: state={state_count}, action={action_count}, render={render_count}')

          path.write_text(text)

      - name: Verificar compilación y reglas
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run check:commercial
          npm run build

      - name: Publicar corrección en rama QA
        shell: bash
        run: |
          if git diff --quiet -- src/components/modules/OperatorConsole.tsx; then
            echo 'Sin cambios pendientes.'
            exit 0
          fi
          git config user.name 'central-go-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/components/modules/OperatorConsole.tsx
          git commit -m 'fix: allow parallel actions across operator trips'
          git push origin HEAD:qa/operator-stress-audit
