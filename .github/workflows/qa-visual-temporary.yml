name: QA visual temporal Central GO

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar app y navegador QA
        run: |
          npm ci
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Crear prueba visual autenticada
        shell: bash
        run: |
          cat > qa-visual.spec.cjs <<'TEST'
          const { test, expect } = require('@playwright/test');

          test.describe.configure({ mode: 'serial' });

          const BASE = 'https://central-go-git-qa-operator-stress-audit-ignacio-s-ziio.vercel.app/?_vercel_share=4FXpum7577h7PyRNQthCceqQIy7KVNjK';
          const ADMIN_EMAIL = 'qa-central-visual-20260826@centralgo.test';
          const ADMIN_PASSWORD = 'CentralGo-QA-20260826!Visual7';
          const OPERATOR_NAME = 'Operadora QA E2E';
          const OPERATOR_USER = 'qaop260826';
          const OPERATOR_PASSWORD = 'QaOperator!260826';

          async function loginAdmin(page) {
            const response = await page.goto(BASE, { waitUntil: 'domcontentloaded', timeout: 45000 });
            expect(response && response.ok()).toBeTruthy();
            const policy = response.headers()['permissions-policy'] || '';
            expect(policy).toContain('microphone=(self)');
            await expect(page.getByRole('heading', { name: 'Vuelve a tu operación' })).toBeVisible({ timeout: 20000 });
            await page.getByLabel('Correo electrónico').fill(ADMIN_EMAIL);
            await page.getByLabel('Contraseña').fill(ADMIN_PASSWORD);
            await page.getByRole('button', { name: 'Iniciar sesión', exact: true }).click();
            await expect(page.getByRole('heading', { name: 'Vuelve a tu operación' })).toHaveCount(0, { timeout: 30000 });
            await page.waitForTimeout(2500);
          }

          async function assertNoHorizontalOverflow(page, label) {
            const metrics = await page.evaluate(() => ({
              viewport: window.innerWidth,
              html: document.documentElement.scrollWidth,
              body: document.body.scrollWidth,
            }));
            expect(metrics.html, `${label}: html overflow`).toBeLessThanOrEqual(metrics.viewport + 3);
            expect(metrics.body, `${label}: body overflow`).toBeLessThanOrEqual(metrics.viewport + 3);
          }

          test('flujo real admin → crear operadora → terminal → turno', async ({ browser }) => {
            const context = await browser.newContext({ viewport: { width: 1440, height: 900 } });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(String(error)));

            await loginAdmin(page);
            await assertNoHorizontalOverflow(page, 'dashboard escritorio');
            await page.screenshot({ path: 'test-results/01-admin-dashboard-desktop.png', fullPage: true });

            await page.keyboard.press('F2');
            await expect(page.getByRole('heading', { name: 'Nueva carrera' })).toBeVisible({ timeout: 10000 });
            await assertNoHorizontalOverflow(page, 'modal nueva carrera escritorio');
            await page.screenshot({ path: 'test-results/02-new-trip-desktop.png', fullPage: true });
            await page.getByRole('button', { name: 'Cerrar' }).click();

            const operatorsNav = page.getByText('Operadores', { exact: true }).first();
            await expect(operatorsNav).toBeVisible({ timeout: 15000 });
            await operatorsNav.click();
            await expect(page.getByRole('heading', { name: 'Operadores y operadoras' })).toBeVisible({ timeout: 15000 });

            if (await page.getByText(OPERATOR_NAME, { exact: true }).count() === 0) {
              await page.getByRole('button', { name: 'Crear acceso' }).click();
              await expect(page.getByRole('heading', { name: 'Agregar operador/a' })).toBeVisible();
              await page.getByPlaceholder('Nombre del operador o la operadora').fill(OPERATOR_NAME);
              await page.getByPlaceholder('operador01').fill(OPERATOR_USER);
              await page.getByPlaceholder('Mínimo 10 caracteres').fill(OPERATOR_PASSWORD);
              await page.getByPlaceholder('Repite la contraseña').fill(OPERATOR_PASSWORD);
              await page.getByRole('button', { name: 'Crear usuario y contraseña' }).click();
              await expect(page.getByText(OPERATOR_NAME, { exact: true })).toBeVisible({ timeout: 30000 });
            }

            await assertNoHorizontalOverflow(page, 'operadores escritorio');
            await page.screenshot({ path: 'test-results/03-operators-desktop.png', fullPage: true });

            const authorize = page.getByRole('button', { name: 'Autorizar este computador' });
            if (await authorize.isVisible().catch(() => false)) {
              await authorize.click();
              await expect(page.getByText(/Autorizada ·/)).toBeVisible({ timeout: 20000 });
            }
            await page.screenshot({ path: 'test-results/04-terminal-authorized.png', fullPage: true });

            await page.getByRole('button', { name: 'Ir al acceso de operadores' }).click();
            await expect(page.getByRole('heading', { name: 'Acceso de operador' })).toBeVisible({ timeout: 30000 });
            await page.getByLabel('Usuario').fill(OPERATOR_USER);
            await page.getByLabel('Contraseña').fill(OPERATOR_PASSWORD);
            await page.getByRole('button', { name: 'Iniciar turno' }).click();
            await expect(page.getByRole('heading', { name: 'Acceso de operador' })).toHaveCount(0, { timeout: 30000 });
            await page.waitForTimeout(3000);

            await assertNoHorizontalOverflow(page, 'turno operadora escritorio');
            await page.screenshot({ path: 'test-results/05-operator-shift-desktop.png', fullPage: true });

            await page.keyboard.press('F2');
            await expect(page.getByRole('heading', { name: 'Nueva carrera' })).toBeVisible({ timeout: 10000 });
            await page.getByPlaceholder('Dirección de retiro').fill('Plaza de Armas, Linares, Chile');
            await assertNoHorizontalOverflow(page, 'modal operadora escritorio');
            await page.screenshot({ path: 'test-results/06-operator-new-trip.png', fullPage: true });
            await page.getByRole('button', { name: 'Cerrar' }).click();

            expect(pageErrors, `Errores JS de página: ${pageErrors.join(' | ')}`).toEqual([]);
            await context.close();
          });

          for (const device of [
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'movil', width: 390, height: 844 },
          ]) {
            test(`layout ${device.name} + modal F2`, async ({ browser }) => {
              const context = await browser.newContext({ viewport: { width: device.width, height: device.height } });
              const page = await context.newPage();
              const pageErrors = [];
              page.on('pageerror', error => pageErrors.push(String(error)));
              await loginAdmin(page);
              await assertNoHorizontalOverflow(page, `${device.name} dashboard`);
              await page.screenshot({ path: `test-results/10-${device.name}-dashboard.png`, fullPage: true });
              await page.keyboard.press('F2');
              await expect(page.getByRole('heading', { name: 'Nueva carrera' })).toBeVisible({ timeout: 10000 });
              await assertNoHorizontalOverflow(page, `${device.name} modal`);
              await page.screenshot({ path: `test-results/11-${device.name}-new-trip.png`, fullPage: true });
              await expect(page.getByRole('button', { name: 'Cerrar' })).toBeVisible();
              expect(pageErrors, `Errores JS ${device.name}: ${pageErrors.join(' | ')}`).toEqual([]);
              await context.close();
            });
          }
          TEST

      - name: Ejecutar Chromium contra preview QA
        run: npx playwright test qa-visual.spec.cjs --workers=1 --reporter=line

      - name: Guardar capturas y reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-go-visual-qa
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            playwright-report/**
          if-no-files-found: warn
          retention-days: 3
