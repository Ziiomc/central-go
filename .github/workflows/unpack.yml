name: Publicar código Central GO

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar si queda trabajo pendiente
        id: pendiente
        shell: bash
        run: |
          if [ -d .bootstrap ]; then
            echo "ejecutar=true" >> "$GITHUB_OUTPUT"
          else
            echo "ejecutar=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruir proyecto
        if: steps.pendiente.outputs.ejecutar == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/central-go.tar.xz
          echo "cb119f0c18190bde8ef8aa02400d72e8c3c24bdad34f7f227d8fd7df63fd0c19  /tmp/central-go.tar.xz" | sha256sum --check
          tar -xJf /tmp/central-go.tar.xz -C .
          rm -rf .bootstrap
          rm -f bootstrap.mjs

      - name: Publicar código fuente
        if: steps.pendiente.outputs.ejecutar == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publicar versión mejorada de Central GO"
          git push origin HEAD:main
