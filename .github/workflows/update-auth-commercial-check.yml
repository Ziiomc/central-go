name: Align auth commercial check

on:
  push:
    branches:
      - fix/simple-password-no-email

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/simple-password-no-email
      - name: Update auth quality invariant
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/commercial-check.mjs')
          s=p.read_text()
          old="if (!login.includes('Olvidé mi contraseña') || !auth.includes('resetPasswordForEmail')) fail('Falta recuperación de contraseña oficial.');"
          new="if (login.includes('Entrar con enlace al correo') || login.includes('Crear cuenta sólo con correo') || login.includes('Olvidé mi contraseña') || auth.includes('resetPasswordForEmail')) fail('El acceso oficial volvió a depender de enlaces enviados por correo.');\nif (!login.includes('Mínimo 8 caracteres') || !auth.includes('createPasswordAccountWithoutEmail') || !auth.includes('signInWithCompatiblePassword')) fail('Falta el acceso oficial con contraseña simple y alta directa.');"
          if old not in s:
              raise SystemExit('auth commercial invariant not found')
          p.write_text(s.replace(old,new))
      - name: Commit quality gate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/commercial-check.mjs
          git diff --cached --check
          git commit -m "test align commercial auth checks with direct password flow"
          git push origin HEAD:fix/simple-password-no-email
