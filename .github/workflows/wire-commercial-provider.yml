name: Cablear proveedor comercial

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-commercial-provider.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar cableado
        run: node scripts/wire-commercial-provider.mjs
      - name: Retirar instalador temporal
        run: rm -f scripts/wire-commercial-provider.mjs
      - name: Publicar cambios
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src vercel.json scripts/wire-commercial-provider.mjs
          git commit -m "Cablear proveedor comercial Supabase"
          git pull --rebase origin main
          git push origin HEAD:main
