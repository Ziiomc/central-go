name: Conectar panel real de centrales

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wire-network-centrals.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Aplicar conexión real de centrales v2
        run: node scripts/wire-network-centrals.mjs
      - run: rm -f scripts/wire-network-centrals.mjs
      - name: Publicar
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts/wire-network-centrals.mjs
          git commit -m "Conectar Superadmin a centrales reales de Supabase"
          git pull --rebase origin main
          git push origin HEAD:main
