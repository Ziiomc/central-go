<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Central GO - Sistema de Despacho y Gestión de Radiotaxis</title>
    <meta name="description" content="Central GO: plataforma oficial de gestión, despacho y seguimiento GPS para centrales de radiotaxis." />
    <meta name="theme-color" content="#0b2340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Central GO" />
    <script src="/bootstrap.js"></script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      html[data-theme="dark"] body [data-centralgo-reservation="true"] {
        border-color: rgba(14, 165, 233, 0.42) !important;
        background: linear-gradient(90deg, rgba(8, 47, 73, 0.98), rgba(9, 25, 42, 0.98)) !important;
        box-shadow: inset 4px 0 0 rgba(14, 165, 233, 0.9), 0 10px 28px rgba(0, 0, 0, 0.16) !important;
        color: #f8fafc !important;
      }
      html[data-theme="dark"] body [data-centralgo-reservation="true"] .text-white,
      html[data-theme="dark"] body [data-centralgo-reservation="true"] .text-zinc-200,
      html[data-theme="dark"] body [data-centralgo-reservation="true"] .text-zinc-300,
      html[data-theme="dark"] body [data-centralgo-reservation="true"] .text-zinc-400 {
        color: #e2e8f0 !important;
      }
      html[data-theme="dark"] body [data-centralgo-reservation="true"]::before {
        border-color: rgba(56, 189, 248, 0.42) !important;
        background: rgba(2, 132, 199, 0.9) !important;
        color: #ffffff !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-cyan-500/25 selection:text-cyan-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
