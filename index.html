<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Central GO - Sistema de Despacho y Gestión de Radiotaxis</title>
    <meta name="description" content="Central GO: plataforma oficial de gestión, despacho y seguimiento GPS para centrales de radiotaxis." />
    <meta name="theme-color" content="#0b2340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Central GO" />
    <script src="/bootstrap.js"></script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <style>
      /* Acciones de despacho compactas: el significado se conserva con icono + tooltip. */
      button[title="Asignar"],
      button[title="Editar carrera"],
      button[title="Cancelar carrera"] {
        font-size: 0 !important;
        width: 30px !important;
        height: 30px !important;
        min-width: 30px !important;
        padding: 0 !important;
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 0 !important;
      }
      button[title="Asignar"] svg,
      button[title="Editar carrera"] svg,
      button[title="Cancelar carrera"] svg {
        width: 15px !important;
        height: 15px !important;
        margin: 0 !important;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-cyan-500/25 selection:text-cyan-100 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
