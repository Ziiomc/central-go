# Per-function settings for reproducible Supabase Edge Function deployments.
# Every function listed with verify_jwt=false performs its own explicit trust
# validation because the caller cannot always provide a Supabase user JWT.

# Trusted pg_net calls use x-centralgo-push-secret; user calls are validated in
# the handler with auth.getUser + company/global role checks.
[functions.push-driver-trip]
verify_jwt = false

# Mercado Pago calls this endpoint directly and authenticates each notification
# with its x-signature HMAC. Provider webhooks cannot carry a Supabase user JWT.
[functions.mercadopago-webhook]
verify_jwt = false

# Mercado Pago redirects the browser here after OAuth. Security is provided by
# one-time expiring state + PKCE generated by the authenticated Superadmin start.
[functions.mercadopago-oauth-callback]
verify_jwt = false

# Internal routing jobs come from pg_net and must present the private routing
# secret before any service-role operation is executed.
[functions.route-dispatch-matrix]
verify_jwt = false

# Passenger requests are intentionally public. The function uses service-only
# RPCs, subscription eligibility, IP/phone rate limiting and trip+phone tracking.
[functions.passenger-request-trip]
verify_jwt = false

# This function validates Authorization inside the handler so it can support the
# deliberately scoped Superadmin, Partner-owner and company-admin driver flows.
[functions.invite-company-user]
verify_jwt = false
